# --- ETAPA 2: SEGURIDAD (SAST) ---
  sast-scan:
    name: SAST Analysis (Semgrep)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep OSS
        # Usamos la acción oficial que gestiona los permisos de archivos correctamente
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/python
            p/security-audit
            p/secrets
            p/kubernetes
        # Esta acción genera un archivo llamado sarsif por defecto, 
        # pero forzaremos un TXT para tu reporte manual

      - name: Generate Text Report
        # Ejecutamos un escaneo rápido solo para generar el archivo de texto
        run: |
          pip install semgrep
          semgrep scan --config=auto --verbose . > semgrep-report.txt 2>&1 || true
      - name: Upload Semgrep Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-sast-semgrep
          path: semgrep-report.txt

  # --- ETAPA 3: SEGURIDAD (SCA) ---
  sca-scan:
    name: SCA Analysis (Trivy)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip freeze > requirements-frozen.txt # Creamos un archivo con versiones exactas para Trivy

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config' # Cambiamos a config/fs combinado
          scan-ref: '.'
          # Agregamos esta línea para que busque específicamente archivos de dependencias
          vuln-type: 'os,library' 
          format: 'table'
          output: 'trivy-report.txt'
          exit-code: '0'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'

      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-sca-trivy
          path: trivy-report.txt

  # --- ETAPA 4: BUILD ---
  build-and-push:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [sast-scan, sca-scan]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker build -t mi-app-devops:${{ github.sha }} .
          
      - name: Scan Docker Image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'mi-app-devops:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'

  # --- ETAPA 5: PREPARAR GITOPS ---
  deploy-trigger:
    name: Prep GitOps (ArgoCD)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Report Status
        run: echo "Imagen aprobada y lista para que ArgoCD la sincronice en el clúster local."