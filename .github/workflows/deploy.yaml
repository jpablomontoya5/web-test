name: DevSecOps Pipeline

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # --- ETAPA 1: TEST Y COBERTURA ---
  unit-tests:
    name: Run Unit Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Test with pytest and coverage
        run: |
          # Ejecuta pruebas y falla si la cobertura es menor al 80% (Punto 1.c)
          pytest --cov=app app/ --cov-fail-under=80

  # --- ETAPA 2: SEGURIDAD (SAST) ---
  sast-scan:
    name: SAST Analysis (Semgrep)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep OSS Scan
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" returntocorp/semgrep semgrep scan --config=auto --error
      - name: Upload Semgrep Report
        uses: actions/upload-artifact@v4
        if: always() # Obliga a subir el archivo aunque el escaneo falle
        with:
          name: reporte-sast-semgrep
          path: semgrep-report.txt

# --- ETAPA 3: SEGURIDAD (SCA) ---
  sca-scan:
    name: SCA Analysis (Trivy)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      # PASO CLAVE: Instalar dependencias para que Trivy las detecte
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scan dependencies for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'          # Escanea el directorio actual donde instalaste las librerías
          ignore-unfixed: true
          format: 'table'
          exit-code: '1' 
          severity: 'CRITICAL,HIGH'
          scanners: 'vuln,secret' # Asegura que busque vulnerabilidades y secretos explícitamente
      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-sca-trivy
          path: trivy-report.txt


  # --- ETAPA 4: BUILD ---
  build-and-push:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [sast-scan, sca-scan]
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker Image
        run: |
          docker build -t mi-app-devops:${{ github.sha }} .
          
      - name: Scan Docker Image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'mi-app-devops:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'

  # --- ETAPA 5: PREPARAR GITOPS ---
  deploy-trigger:
    name: Prep GitOps (ArgoCD)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Report Status
        run: |
          echo "Imagen aprobada y lista para que ArgoCD la sincronice en el clúster local."