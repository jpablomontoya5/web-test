name: DevSecOps Pipeline

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # --- ETAPA 1: TEST Y COBERTURA ---
  unit-tests:
    name: Run Unit Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Test with pytest and coverage
        run: |
          # Ejecuta pruebas y falla si la cobertura es menor al 80% (Punto 1.c)
          pytest --cov=app app/ --cov-fail-under=80

  # --- ETAPA 2: SEGURIDAD (SAST) ---
  sast-scan:
    name: SAST Analysis (Semgrep)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep OSS Scan
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" returntocorp/semgrep semgrep scan --config=auto --error

  # --- ETAPA 3: SEGURIDAD (SCA) ---
  sca-scan:
    name: SCA Analysis (Trivy)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - name: Scan dependencies for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          exit-code: '1' # Falla el pipeline si encuentra vulnerabilidades críticas
          severity: 'CRITICAL,HIGH'

  # --- ETAPA 4: BUILD ---
  build-and-push:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [sast-scan, sca-scan]
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker Image
        run: |
          docker build -t mi-app-devops:${{ github.sha }} .
          
      - name: Scan Docker Image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'mi-app-devops:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'

  # --- ETAPA 5: PREPARAR GITOPS ---
  deploy-trigger:
    name: Prep GitOps (ArgoCD)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Report Status
        run: |
          echo "Imagen aprobada y lista para que ArgoCD la sincronice en el clúster local."