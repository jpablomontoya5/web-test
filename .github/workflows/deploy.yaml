name: DevSecOps Pipeline

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # --- ETAPA 1: TEST Y COBERTURA ---
  unit-tests:
    name: Run Unit Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Test with pytest and coverage
        run: pytest --cov=app app/ --cov-fail-under=80

# --- ETAPA 2: SEGURIDAD (SAST) ---
  sast-scan:
    name: SAST Analysis (Semgrep)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Semgrep OSS
        # Usamos la action oficial para evitar problemas de permisos de Docker
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
        # Generamos el reporte manualmente si la action no lo hace por defecto
      
      - name: Generate Manual Semgrep Text Report
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" returntocorp/semgrep semgrep scan --config=auto --text --output=semgrep-report.txt
        continue-on-error: true

      - name: Upload Semgrep Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-sast-semgrep
          path: semgrep-report.txt

  # --- ETAPA 3: SEGURIDAD (SCA) ---
  sca-scan:
    name: SCA Analysis (Trivy)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scan dependencies (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          # Cambiamos a escaneo de directorio explícito
          scan-type: 'fs'
          scan-ref: '.' 
          format: 'table'
          output: 'trivy-report.txt'
          exit-code: '0' # Cambiamos a 0 para asegurar que el archivo se genere siempre
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-sca-trivy
          path: trivy-report.txt

  # --- ETAPA 4: BUILD ---
  build-and-push:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [sast-scan, sca-scan]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker build -t mi-app-devops:${{ github.sha }} .
          
      - name: Scan Docker Image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'mi-app-devops:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'

  # --- ETAPA 5: PREPARAR GITOPS ---
  deploy-trigger:
    name: Prep GitOps (ArgoCD)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Report Status
        run: echo "Imagen aprobada y lista para que ArgoCD la sincronice en el clúster local."