name: CI/CD Docker App

on:
  push:
    branches: [ "feature/dev" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen de Docker
        run: |
          docker build -t mi-app-github:latest .

      - name: Test de la imagen
        run: |
          docker run -d -p 8000:8000 --name test-container mi-app-github:latest
          sleep 5
          curl localhost:8000 | grep "Bienvenido"
          docker stop test-container