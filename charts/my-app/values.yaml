replicaCount: 2

podSecurityContext: {}

securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1000
  #readOnlyRootFilesystem: true
  imagePullPolicy: IfNotPresent


image:
  repository: mi-app-devops
  pullPolicy: IfNotPresent
  tag: "8cdcc0600ae638010a77c399450d9ca9112d0f9e"

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 10

ingress:
  enabled: false

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi